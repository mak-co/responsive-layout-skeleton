<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="output.css">
  <title>Structure</title>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- entire Website -->
  <div class="flex flex-col lg:flex-row min-h-screen border border-white">

    <!-- Sidebar -->
    <div class="w-full lg:w-64 border border-white flex flex-col">

      <!-- Logo Area -->
      <div class="h-20 border border-white flex items-center justify-center">
        Logo Area
      </div>

      <!-- Navigation -->
      <div class="flex-1 border border-white flex items-center justify-center min-h-[200px]">
        Sidebar / Navigation
      </div>

      <!-- Profile section -->
      <div class="h-32 border border-white flex items-center justify-center">
        Profile Section
      </div>

    </div>



    <!-- rght main Section -->
    <div class="flex flex-col flex-1 border border-white">

      <!-- Header -->
      <div class="h-20 border border-white flex items-center justify-center">
        Header / Navbar
      </div>



      <!-- middle content area -->
      <div class="flex flex-col xl:flex-row flex-1 border border-white">

        <!-- main Ffeed -->
        <div class="flex-1 border border-white flex items-center justify-center min-h-[300px]">
          Main Feed / Content
        </div>

        <!-- right sidebar -->
        <div class="w-full xl:w-80 border border-white flex items-center justify-center min-h-[200px]">
          Right Sidebar
        </div>

      </div>



      <!-- Footer -->
      <div class="h-16 border border-white flex items-center justify-center">
        Footer
      </div>

    </div>

  </div>

</body>
</html>
